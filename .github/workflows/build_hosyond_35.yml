name: Build Hosyond 3.5 Display Firmware

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Hosyond 3.5'' Firmware
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
          export PATH=$PATH:$GITHUB_WORKSPACE/bin
          arduino-cli version

      - name: Install ESP32 Platform
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.11 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install Libraries
        run: |
          # Clone libraries into $GITHUB_WORKSPACE/libraries_custom
          mkdir -p libraries_custom
          
          git clone --depth 1 --branch 1.6 https://github.com/marian-craciunescu/ESP32Ping libraries_custom/ESP32Ping
          git clone --depth 1 --branch v3.4.8 https://github.com/ESP32Async/AsyncTCP libraries_custom/AsyncTCP
          git clone --depth 1 --branch v2.0.6 https://github.com/stevemarple/MicroNMEA libraries_custom/MicroNMEA
          git clone --depth 1 --branch v3.8.1 https://github.com/ESP32Async/ESPAsyncWebServer libraries_custom/ESPAsyncWebServer
          git clone --depth 1 --branch V2.5.34 https://github.com/Bodmer/TFT_eSPI libraries_custom/TFT_eSPI
          git clone --depth 1 --branch v1.4 https://github.com/PaulStoffregen/XPT2046_Touchscreen libraries_custom/XPT2046_Touchscreen
          git clone --depth 1 --branch 3.0.0 https://github.com/lvgl/lv_arduino libraries_custom/lv_arduino
          git clone --depth 1 --branch 1.8.0 https://github.com/Bodmer/JPEGDecoder libraries_custom/JPEGDecoder
          git clone --depth 1 --branch 1.3.8 https://github.com/h2zero/NimBLE-Arduino libraries_custom/NimBLE-Arduino
          git clone --depth 1 --branch 1.12.0 https://github.com/adafruit/Adafruit_NeoPixel libraries_custom/Adafruit_NeoPixel
          git clone --depth 1 --branch v6.18.2 https://github.com/bblanchon/ArduinoJson libraries_custom/ArduinoJson
          git clone --depth 1 --branch v1.3.3 https://github.com/ivanseidel/LinkedList libraries_custom/LinkedList
          git clone --depth 1 --branch 8.1.0 https://github.com/plerup/espsoftwareserial libraries_custom/espsoftwareserial
          git clone --depth 1 --branch 1.15.0 https://github.com/adafruit/Adafruit_BusIO libraries_custom/Adafruit_BusIO
          git clone --depth 1 --branch 1.0.2 https://github.com/adafruit/Adafruit_MAX1704X libraries_custom/Adafruit_MAX1704X
          cp -r libraries/Adafruit_TCA8418 libraries_custom/Adafruit_TCA8418

      - name: Configure TFT_eSPI
        run: |
          # Copy setup files to the library
          cp User*.h libraries_custom/TFT_eSPI/
          # Ensure User_Setup_Select.h is using the correct file
          sed -i 's/^\/\/#include <User_Setup_cyd_3_5_inch.h>/#include <User_Setup_cyd_3_5_inch.h>/' libraries_custom/TFT_eSPI/User_Setup_Select.h

      - name: Build Firmware
        run: |
          # Add custom libraries to arduino-cli search path
          arduino-cli config init --dest-dir .
          arduino-cli config set directories.user $GITHUB_WORKSPACE/arduino_user
          mkdir -p arduino_user/libraries
          cp -r libraries_custom/* arduino_user/libraries/
          
          # Compile
          arduino-cli compile --fqbn esp32:esp32:d32:PartitionScheme=min_spiffs \
            --build-property compiler.cpp.extra_flags="-DMARAUDER_CYD_3_5_INCH" \
            --output-dir build \
            esp32_marauder/esp32_marauder.ino

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32_marauder_hosyond_35
          path: build/*.bin
          retention-days: 5
